name: opencode-triage

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      prompt:
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  opencode:
    runs-on: ubuntu-latest

    timeout-minutes: 180

    env:
      NODE_OPTIONS: "--max-old-space-size=8192"

    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.ref || github.event.repository.default_branch }}
          token: ${{ secrets.PAT_TOKEN || secrets.OPENCODE_GITHUB_TOKEN }}

      - name: Show memory budget
        run: |
          echo "Agent heap limit: 8 GiB (NODE_OPTIONS=--max-old-space-size=8192)"
          free -h || true

      - name: Configure git for all repositories
        env:
          TOKEN: ${{ secrets.PAT_TOKEN || secrets.OPENCODE_GITHUB_TOKEN }}
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Export provider API key
        env:
          KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "OPENCODE_API_KEY=$KEY" >> "$GITHUB_ENV"
          fi

      - name: Load triage prompt
        run: |
          if [ -f "prompts/triage.md" ]; then
            {
              echo "TRIAGE_PROMPT<<EOF"
              cat prompts/triage.md
              echo
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Prepare scripts
        run: |
          if [ -d ".github/scripts" ]; then
            chmod +x .github/scripts/*.sh || true
            ls -l .github/scripts/ || true
          fi

      - name: Remember state of checkout
        run: echo "CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install OpenCode binary
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version 2.0.22
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Configure OpenCode
        env:
          OPENCODE_MODELS: ${{ vars.OPENCODE_MODELS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/opencode"
          chain="${OPENCODE_MODELS:-opencode/glm-5.3-flash-free opencode/deepseek-v4.1-flash-free opencode/flint-40b-free opencode/beam-free opencode/mimo-v2.6-flash-free}"
          first="${chain%% *}"
          cat > "$HOME/.config/opencode/opencode.jsonc" <<EOF
          {
            "\$schema": "https://opencode.ai/config.json",
            "permission": "allow",
            "model": "$first"
          }
          EOF
          cat "$HOME/.config/opencode/opencode.jsonc"

      - name: Import OpenCode credentials (if configured)
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          if [ -n "$OPENCODE_AUTH_JSON" ]; then
            printf '%s' "$OPENCODE_AUTH_JSON" | opencode auth import
            echo "OpenCode credentials imported."
          else
            echo "No OPENCODE_AUTH_JSON secret; staying on anonymous free inference."
          fi

      - name: Run OpenCode with fallback & live logging
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.OPENCODE_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.OPENCODE_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PROMPT: ${{ github.event.inputs.prompt || env.TRIAGE_PROMPT }}
          OPENCODE_GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.OPENCODE_GITHUB_TOKEN }}
          OPENCODE_ADMIN_TOKEN: ${{ secrets.OPENCODE_ADMIN_TOKEN }}
          # Optional free-tier provider keys. OpenCode picks up whichever of
          # these are set; leave them unset to stay on opencode's free models.
          # Google/Gemini is deliberately not wired in: the runner is free
          # models only.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENCODE_PERMISSION: '{"*":"allow"}'
          OPENCODE_STALL_TIMEOUT: "120"
          OPENCODE_ATTEMPT_TIMEOUT: "1200"
        run: .github/scripts/run-opencode-fallback.sh

      - name: Create or Update Pull Request Automatically
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.OPENCODE_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '0' }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          base="${BASE:-main}"
          # The agent pushes the fix on its own branch, find it among the
          # remote branches and open a pull request from it when it is ahead of
          # the base branch.
          git fetch --quiet --no-tags origin '+refs/heads/*:refs/remotes/origin/*' || true
          head_ref=""
          while read -r ref; do
            name="${ref#refs/remotes/origin/}"
            if [ "$name" = "$base" ]; then
              continue
            fi
            count="$(git rev-list --count "$base..$ref" 2>/dev/null || echo 0)"
            if [ "${count:-0}" -gt 0 ]; then
              head_ref="$ref"
              break
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)
          if [ -z "$head_ref" ]; then
            echo "no agent branch ahead of $base was found, nothing to open a pull request for"
            exit 0
          fi
          head_name="${head_ref#refs/remotes/origin/}"
          echo "the agent pushed $head_name"
          if gh pr view "$head_name" --json number --jq .number >/dev/null 2>&1; then
            echo "a pull request for $head_name already exists"
            exit 0
          fi
          gh pr create --head "$head_name" \
            --base "$base" \
            --title "AI Agent Fix for Issue #${ISSUE_NUMBER}" \
            --body "Automated agent fix for issue #${ISSUE_NUMBER}. The fix lives on branch ${head_name} and was produced by the OpenCode agent." \
            || echo "no pull request was created (it may already exist)"

      - name: Make sure source tree was not touched
        run: |
          set -euo pipefail
          changed="$(git status --porcelain || true)"
          if [ -n "$changed" ] || [ "$(git rev-parse HEAD)" != "$CHECKOUT_SHA" ]; then
            echo "::warning::the agent changed the checkout, it is restored"
            printf '%s\n' "$changed"
            git fetch --quiet --no-tags origin "$CHECKOUT_SHA" || true
            git reset --hard "$CHECKOUT_SHA" || true
            git clean -fdq
            git checkout --force "$CHECKOUT_SHA" || true
          fi
          echo "the checkout is clean:"
          git status --porcelain
          git rev-parse HEAD
